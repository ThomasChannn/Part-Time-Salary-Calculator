<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>兼職工資計算機</title>
    <style>
        /* CSS 變數定義 */
        :root { 
            --primary: #4CAF50; 
            --bg: #f4f4f9; 
            --text: #333; 
            --container-bg: #ffffff;
            --border-color: #ddd;
            --input-bg: #fff;
            --table-head: #f2f2f2;
            --hover-bg: #f0f8ff;
            --modal-bg: #fff;
            --dim-text: #777;
            --today-bg: rgba(76, 175, 80, 0.1); /* 今日格子的背景 */
        }
        
        /* 黑夜模式變數 */
        body.dark-theme {
            --bg: #121212;
            --text: #e0e0e0;
            --container-bg: #1e1e1e;
            --border-color: #444;
            --input-bg: #2d2d2d;
            --table-head: #333;
            --hover-bg: #2a2a2a;
            --modal-bg: #222;
            --dim-text: #aaa;
            --today-bg: rgba(76, 175, 80, 0.2); 
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; transition: background-color 0.3s, color 0.3s; }
        .container { max-width: 900px; margin: 0 auto; background: var(--container-bg); padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* Header & Theme */
        .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 15px; }
        .header-top h1, .header-top h2 { margin: 0; color: var(--primary); }
        .theme-toggle { background: #555; margin: 0; }
        
        h1, h2, h3 { color: var(--primary); }
        button { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; margin: 5px 0; }
        button:hover { opacity: 0.9; }
        input, select { padding: 10px; margin: 5px 0 15px 0; border: 1px solid var(--border-color); border-radius: 4px; width: 100%; box-sizing: border-box; background: var(--input-bg); color: var(--text); color-scheme: light dark; font-size: 16px; }
        hr { border: 0; border-top: 1px solid var(--border-color); margin: 20px 0; }
        
        /* Screens & Tabs */
        #app-screen, .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Mobile-friendly Tabs */
        .tabs { display: flex; border-bottom: 2px solid var(--primary); margin-bottom: 20px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
        .tab-btn { background: none; color: var(--text); border-radius: 5px 5px 0 0; margin: 0; border: 1px solid transparent; flex: 0 0 auto; padding: 12px 15px; }
        .tab-btn.active { background: var(--primary); color: white; }
        .tabs::-webkit-scrollbar { height: 4px; }
        .tabs::-webkit-scrollbar-thumb { background-color: var(--primary); border-radius: 4px; }
        
        /* Calendar */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .day-name { text-align: center; font-weight: bold; padding: 10px 0; background: var(--table-head); border-radius: 4px; font-size: 14px; }
        .day-cell { border: 1px solid var(--border-color); min-height: 90px; padding: 5px; cursor: pointer; background: var(--container-bg); border-radius: 4px; overflow: hidden; word-wrap: break-word; position: relative; }
        .day-cell.empty-cell { background: var(--table-head); border: none; cursor: default; }
        .day-cell:not(.empty-cell):hover { background: var(--hover-bg); }
        
        .day-date { font-weight: bold; color: var(--dim-text); margin-bottom: 5px; font-size: 14px; display: inline-block; }
        
        /* 今日標記樣式 */
        .today-cell { border: 2px solid var(--primary) !important; background-color: var(--today-bg) !important; }
        .today-date { background-color: var(--primary); color: white !important; border-radius: 50%; width: 24px; height: 24px; line-height: 24px; text-align: center; }

        .work-badge { padding: 4px; border-radius: 3px; font-size: 12px; color: white; margin-bottom: 3px; display: block; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); line-height: 1.2; word-break: break-all; }
        
        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 100; padding: 15px; box-sizing: border-box; }
        .modal-content { background: var(--modal-bg); padding: 20px; border-radius: 8px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; color: var(--text); }
        .close-btn { float: right; cursor: pointer; font-size: 28px; font-weight: bold; line-height: 1; margin-top: -5px; }
        
        /* Lists & Tables */
        .job-list { list-style: none; padding: 0; }
        .job-item { border: 1px solid var(--border-color); padding: 12px; margin-bottom: 10px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .color-box { width: 16px; height: 16px; display: inline-block; border-radius: 50%; margin-right: 8px; vertical-align: middle; border: 1px solid #ccc; }
        
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 5px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; min-width: 450px; } 
        th, td { border: 1px solid var(--border-color); padding: 12px 10px; text-align: left; }
        th { background-color: var(--table-head); white-space: nowrap; }
        
        /* Summary Expansion Detail */
        .clickable-row { cursor: pointer; transition: background 0.2s; }
        .clickable-row:hover { background-color: var(--hover-bg); }
        .expand-hint { font-size: 12px; color: var(--dim-text); margin-left: 8px; font-weight: normal; }
        .detail-row td { background-color: var(--hover-bg); padding: 0; border-top: none; }
        .detail-table { width: 100%; border: none; margin: 0; background: transparent; min-width: 100%; }
        .detail-table th, .detail-table td { border: none; border-bottom: 1px dashed var(--border-color); padding: 8px; font-size: 13px; }
        .detail-table th { background: transparent; font-weight: 600; color: var(--dim-text); }
        .detail-table tr:last-child td { border-bottom: none; }

        .flex-buttons { display: flex; gap: 5px; width: 100%; }
        .flex-buttons button { flex: 1; }

        /* Mobile Media Queries */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            .header-top { flex-direction: column; align-items: flex-start; gap: 10px; }
            .theme-toggle { width: 100%; padding: 12px; }
            .calendar-grid { gap: 2px; }
            .day-name { padding: 5px 0; font-size: 12px; }
            .day-cell { min-height: 70px; padding: 2px; }
            .day-date { font-size: 12px; margin-bottom: 2px; }
            .today-date { width: 20px; height: 20px; line-height: 20px; }
            .work-badge { font-size: 10px; padding: 2px; transform: scale(0.95); transform-origin: left top; margin-bottom: 1px; }
            .job-item { flex-direction: column; align-items: flex-start; }
            .job-item > div:last-child { width: 100%; display: flex; gap: 5px; }
            .job-item > div:last-child button { flex: 1; margin: 0; }
            .expand-hint { display: block; margin-left: 0; margin-top: 5px; }
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- 初始畫面 -->
    <div id="start-screen">
        <div class="header-top">
            <h1>兼職工資計算機</h1>
            <button class="theme-toggle" onclick="toggleDarkMode()" id="theme-btn-start">🌙 黑夜模式</button>
        </div>
        <p>系統已偵測到本地紀錄，或你可以選擇以下動作：</p>
        <button onclick="startNew()" style="width: 100%; padding: 12px;">開新計算表 (清除舊資料)</button>
        <br><br>
        <label>上載已有資料 (JSON):</label>
        <input type="file" id="upload-json" accept=".json" onchange="uploadData(event)">
        <br><br>
        <button onclick="loadFromLocal()" id="btn-load-local" style="display:none; background-color: #2196F3; font-size: 16px; padding: 15px; width: 100%;">👉 繼續使用本地儲存的資料</button>
    </div>

    <!-- 主程式畫面 -->
    <div id="app-screen">
        <div class="header-top">
            <h2 id="sheet-title">我的計算表</h2>
            <button class="theme-toggle" onclick="toggleDarkMode()" id="theme-btn-app">🌙 黑夜模式</button>
        </div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('tab-calendar')">月曆排班</button>
            <button class="tab-btn" onclick="switchTab('tab-jobs')">工作設定</button>
            <button class="tab-btn" onclick="switchTab('tab-summary')">當月結算</button>
            <button class="tab-btn" onclick="exportData()" style="background-color: #ff9800; color: white;">下載資料</button>
        </div>

        <!-- 月曆分頁 -->
        <div id="tab-calendar" class="tab-content active">
            <div class="calendar-header">
                <button onclick="changeMonth(-1)">&#9664; 上個月</button>
                <h3 id="current-month-display" style="margin:0;">2023年 10月</h3>
                <button onclick="changeMonth(1)">下個月 &#9654;</button>
            </div>
            <button onclick="openBatchModal()" style="margin-bottom: 15px; background-color: #9c27b0; width: 100%;">+ 批量增加工作時間</button>
            <div class="calendar-grid" id="calendar-grid">
                <!-- Javascript 生成日曆 -->
            </div>
        </div>

        <!-- 工作設定分頁 -->
        <div id="tab-jobs" class="tab-content">
            <h3>我的工作列表</h3>
            <ul id="jobs-ul" class="job-list"></ul>
            <hr>
            <h3>新增 / 編輯工作</h3>
            <input type="hidden" id="job-id">
            <label>工作名稱:</label>
            <input type="text" id="job-name" placeholder="例如：餐廳侍應">
            <label>時薪 ($):</label>
            <input type="number" id="job-rate" placeholder="50">
            <label>代表顏色:</label>
            <input type="color" id="job-color" value="#4CAF50" style="padding: 2px; height: 45px;">
            <label>扣除食飯時間:</label>
            <select id="job-meal-deduct">
                <option value="0">不扣除</option>
                <option value="0.5">扣除 0.5 小時</option>
                <option value="1">扣除 1 小時</option>
            </select>
            <div class="flex-buttons">
                <button onclick="saveJob()">儲存工作設定</button>
                <button onclick="clearJobForm()" style="background: #777; color: white;">清除表格</button>
            </div>
        </div>

        <!-- 結算分頁 -->
        <div id="tab-summary" class="tab-content">
            <h3>當月薪金結算 (<span id="summary-month-display"></span>)</h3>
            <p style="font-size: 13px; color: var(--dim-text);">提示：點擊下方工作列可展開每日明細。若表格顯示不全，可左右滑動查看。</p>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>工作名稱</th>
                            <th>總時數</th>
                            <th>津貼</th>
                            <th>預計工資 ($)</th>
                        </tr>
                    </thead>
                    <tbody id="summary-tbody">
                        <!-- Javascript 生成 -->
                    </tbody>
                </table>
            </div>
            <h2 style="text-align: right; margin-top: 20px;">當月總薪金: $<span id="total-salary">0</span></h2>
        </div>
    </div>
</div>

<!-- 單日紀錄 Modal -->
<div id="day-modal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('day-modal')">&times;</span>
        <h3 id="modal-date-title" style="margin-top:0;">新增/編輯紀錄</h3>
        <input type="hidden" id="record-date">
        
        <label>選擇工作:</label>
        <select id="record-job"></select>
        
        <label>開始時間:</label>
        <input type="time" id="record-start">
        
        <label>結束時間:</label>
        <input type="time" id="record-end">
        
        <label>特別津貼 ($):</label>
        <input type="number" id="record-allowance" value="0">
        
        <div class="flex-buttons" style="margin-top: 10px;">
            <button onclick="saveRecord()">儲存</button>
            <button onclick="deleteRecord()" style="background: #f44336;">刪除紀錄</button>
        </div>
    </div>
</div>

<!-- 批量新增 Modal -->
<div id="batch-modal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('batch-modal')">&times;</span>
        <h3 style="margin-top:0;">批量增加時間</h3>
        <p style="font-size: 13px; color: var(--dim-text); margin-top: 0;">為選取的日期範圍新增工作（如有舊紀錄將被覆蓋）</p>
        
        <label>選擇工作:</label>
        <select id="batch-job"></select>
        
        <div style="display:flex; gap:10px;">
            <div style="flex:1;">
                <label>開始日期:</label>
                <input type="date" id="batch-start-date">
            </div>
            <div style="flex:1;">
                <label>結束日期:</label>
                <input type="date" id="batch-end-date">
            </div>
        </div>
        
        <div style="display:flex; gap:10px;">
            <div style="flex:1;">
                <label>開始時間:</label>
                <input type="time" id="batch-start">
            </div>
            <div style="flex:1;">
                <label>結束時間:</label>
                <input type="time" id="batch-end">
            </div>
        </div>
        
        <label>特別津貼 ($):</label>
        <input type="number" id="batch-allowance" value="0">
        
        <button onclick="saveBatchRecords()" style="margin-top: 10px; width: 100%;">套用至所選日期</button>
    </div>
</div>

<script>
    // 核心資料結構
    let appData = {
        sheetName: "我的兼職計算表",
        jobs: [], 
        records: {} 
    };
    
    let currentDate = new Date();

    // 初始化：檢查 LocalStorage 及 黑夜模式
    window.onload = () => {
        if (localStorage.getItem('partTimeData')) {
            document.getElementById('btn-load-local').style.display = 'inline-block';
        }
        
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-theme');
            updateThemeButtons(true);
        }
    };

    function updateThemeButtons(isDark) {
        const text = isDark ? "☀️ 白天模式" : "🌙 黑夜模式";
        document.getElementById('theme-btn-start').innerText = text;
        if(document.getElementById('theme-btn-app')) {
            document.getElementById('theme-btn-app').innerText = text;
        }
    }

    function toggleDarkMode() {
        const body = document.body;
        body.classList.toggle('dark-theme');
        const isDark = body.classList.contains('dark-theme');
        localStorage.setItem('darkMode', isDark);
        updateThemeButtons(isDark);
    }

    function startNew() {
        if(confirm("確定要開啟新計算表嗎？這將會清除目前的本地紀錄。")) {
            appData = { sheetName: "我的兼職計算表", jobs: [], records: {} };
            saveToLocal();
            enterApp();
        }
    }

    function loadFromLocal() {
        const data = localStorage.getItem('partTimeData');
        if(data) {
            appData = JSON.parse(data);
            enterApp();
        }
    }

    function saveToLocal() {
        localStorage.setItem('partTimeData', JSON.stringify(appData));
    }

    function enterApp() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        updateUI();
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.target.classList.add('active');
        
        if(tabId === 'tab-summary') generateSummary();
        if(tabId === 'tab-calendar') renderCalendar();
    }

    function updateUI() {
        renderJobs();
        renderCalendar();
        populateJobSelects();
    }

    // --- 工作設定邏輯 ---
    function saveJob() {
        const id = document.getElementById('job-id').value || 'job_' + Date.now();
        const name = document.getElementById('job-name').value;
        const rate = parseFloat(document.getElementById('job-rate').value);
        const color = document.getElementById('job-color').value;
        const mealDeduct = parseFloat(document.getElementById('job-meal-deduct').value);

        if(!name || !rate) return alert("請填寫工作名稱和時薪");

        const jobIndex = appData.jobs.findIndex(j => j.id === id);
        const newJob = { id, name, rate, color, mealDeduct };
        
        if(jobIndex > -1) { appData.jobs[jobIndex] = newJob; } 
        else { appData.jobs.push(newJob); }

        saveToLocal();
        clearJobForm();
        updateUI();
    }

    function renderJobs() {
        const ul = document.getElementById('jobs-ul');
        ul.innerHTML = '';
        appData.jobs.forEach(job => {
            const li = document.createElement('li');
            li.className = 'job-item';
            li.innerHTML = `
                <div>
                    <span class="color-box" style="background:${job.color}"></span>
                    <strong>${job.name}</strong> ($${job.rate}/hr)<br>
                    <span style="font-size:13px; color:var(--dim-text);">扣飯鐘: ${job.mealDeduct} hr</span>
                </div>
                <div>
                    <button onclick="editJob('${job.id}')" style="background:#2196F3;">修改</button>
                    <button onclick="deleteJob('${job.id}')" style="background:#f44336;">刪除</button>
                </div>
            `;
            ul.appendChild(li);
        });
    }

    function editJob(id) {
        const job = appData.jobs.find(j => j.id === id);
        if(!job) return;
        document.getElementById('job-id').value = job.id;
        document.getElementById('job-name').value = job.name;
        document.getElementById('job-rate').value = job.rate;
        document.getElementById('job-color').value = job.color;
        document.getElementById('job-meal-deduct').value = job.mealDeduct;
        
        document.getElementById('job-name').scrollIntoView({ behavior: 'smooth' });
    }

    function deleteJob(id) {
        if(confirm("確定刪除此工作設定嗎？(日曆中過去的相關紀錄可能會無法顯示名稱與顏色)")) {
            appData.jobs = appData.jobs.filter(j => j.id !== id);
            saveToLocal();
            updateUI();
        }
    }

    function clearJobForm() {
        document.getElementById('job-id').value = '';
        document.getElementById('job-name').value = '';
        document.getElementById('job-rate').value = '';
        document.getElementById('job-color').value = '#4CAF50';
        document.getElementById('job-meal-deduct').value = '0';
    }

    function populateJobSelects() {
        const opts = appData.jobs.map(j => `<option value="${j.id}">${j.name}</option>`).join('');
        document.getElementById('record-job').innerHTML = opts || '<option value="">請先新增工作</option>';
        document.getElementById('batch-job').innerHTML = opts || '<option value="">請先新增工作</option>';
    }

    // --- 月曆與紀錄邏輯 ---
    function changeMonth(delta) {
        currentDate.setMonth(currentDate.getMonth() + delta);
        renderCalendar();
    }

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        document.getElementById('current-month-display').innerText = `${year}年 ${month + 1}月`;
        
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '<div class="day-name">日</div><div class="day-name">一</div><div class="day-name">二</div><div class="day-name">三</div><div class="day-name">四</div><div class="day-name">五</div><div class="day-name">六</div>';
        
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        // 取得今日實際日期做比對
        const realToday = new Date();
        const isCurrentMonthView = (year === realToday.getFullYear() && month === realToday.getMonth());
        
        for(let i = 0; i < firstDay; i++) {
            grid.innerHTML += `<div class="day-cell empty-cell"></div>`;
        }
        
        for(let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            const records = appData.records[dateStr] || [];
            
            let isToday = (isCurrentMonthView && day === realToday.getDate());
            let cellClass = isToday ? "day-cell today-cell" : "day-cell";
            let dateClass = isToday ? "day-date today-date" : "day-date";
            
            let html = `<div class="${cellClass}" onclick="openDayModal('${dateStr}')">
                        <div class="${dateClass}">${day}</div>`;
            
            records.forEach((rec) => {
                const job = appData.jobs.find(j => j.id === rec.jobId);
                const color = job ? job.color : '#999';
                const name = job ? job.name : '(已刪除)';
                html += `<span class="work-badge" style="background:${color}">${name} <br> ${rec.start}-${rec.end}</span>`;
            });
            
            html += `</div>`;
            grid.innerHTML += html;
        }
    }

    function openDayModal(dateStr) {
        if(appData.jobs.length === 0) return alert("請先到「工作設定」新增至少一份工作。");
        document.getElementById('day-modal').style.display = 'flex';
        document.getElementById('modal-date-title').innerText = `編輯紀錄：${dateStr}`;
        document.getElementById('record-date').value = dateStr;
        
        const existingRec = (appData.records[dateStr] || [])[0]; 
        if(existingRec) {
            document.getElementById('record-job').value = existingRec.jobId;
            document.getElementById('record-start').value = existingRec.start;
            document.getElementById('record-end').value = existingRec.end;
            document.getElementById('record-allowance').value = existingRec.allowance || 0;
        } else {
            document.getElementById('record-start').value = '09:00';
            document.getElementById('record-end').value = '18:00';
            document.getElementById('record-allowance').value = '0';
        }
    }

    function saveRecord() {
        const date = document.getElementById('record-date').value;
        const jobId = document.getElementById('record-job').value;
        const start = document.getElementById('record-start').value;
        const end = document.getElementById('record-end').value;
        const allowance = parseFloat(document.getElementById('record-allowance').value) || 0;
        
        if(!start || !end) return alert("請填寫時間");
        if(!jobId) return alert("請選擇工作");
        
        if(!appData.records[date]) appData.records[date] = [];
        
        const idx = appData.records[date].findIndex(r => r.jobId === jobId);
        const newRec = { jobId, start, end, allowance };
        if(idx > -1) appData.records[date][idx] = newRec;
        else appData.records[date].push(newRec);
        
        saveToLocal();
        closeModal('day-modal');
        renderCalendar();
    }

    function deleteRecord() {
        const date = document.getElementById('record-date').value;
        const jobId = document.getElementById('record-job').value;
        if(appData.records[date]) {
            appData.records[date] = appData.records[date].filter(r => r.jobId !== jobId);
            if(appData.records[date].length === 0) delete appData.records[date];
            saveToLocal();
            closeModal('day-modal');
            renderCalendar();
        }
    }

    // --- 批量新增邏輯 ---
    function openBatchModal() {
        if(appData.jobs.length === 0) return alert("請先新增工作。");
        document.getElementById('batch-modal').style.display = 'flex';
    }

    function saveBatchRecords() {
        const jobId = document.getElementById('batch-job').value;
        const startDate = document.getElementById('batch-start-date').value;
        const endDate = document.getElementById('batch-end-date').value;
        const start = document.getElementById('batch-start').value;
        const end = document.getElementById('batch-end').value;
        const allowance = parseFloat(document.getElementById('batch-allowance').value) || 0;

        if(!startDate || !endDate || !start || !end) return alert("請填滿所有日期與時間欄位");
        if(!jobId) return alert("請選擇工作");

        let curr = new Date(startDate);
        let endD = new Date(endDate);
        
        if(curr > endD) return alert("開始日期不能晚於結束日期");
        
        while(curr <= endD) {
            const dStr = curr.toISOString().split('T')[0];
            if(!appData.records[dStr]) appData.records[dStr] = [];
            const idx = appData.records[dStr].findIndex(r => r.jobId === jobId);
            const newRec = { jobId, start, end, allowance };
            if(idx > -1) appData.records[dStr][idx] = newRec;
            else appData.records[dStr].push(newRec);
            
            curr.setDate(curr.getDate() + 1);
        }
        
        saveToLocal();
        closeModal('batch-modal');
        renderCalendar();
        alert("批量新增完成！");
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // --- 結算與展開邏輯 ---
    function calcHours(start, end) {
        const s = start.split(':'); const e = end.split(':');
        const sTime = new Date(2000,0,1, s[0], s[1]);
        let eTime = new Date(2000,0,1, e[0], e[1]);
        if(eTime < sTime) eTime.setDate(eTime.getDate() + 1); // 跨夜
        return (eTime - sTime) / (1000 * 60 * 60);
    }

    function generateSummary() {
        const year = currentDate.getFullYear();
        const month = String(currentDate.getMonth() + 1).padStart(2, '0');
        const prefix = `${year}-${month}`;
        document.getElementById('summary-month-display').innerText = `${year}年 ${month}月`;
        
        let summary = {};
        appData.jobs.forEach(j => {
            summary[j.id] = { name: j.name, rate: j.rate, totalHours: 0, totalAllowance: 0, salary: 0, mealDeduct: j.mealDeduct, details: [] };
        });

        const sortedDates = Object.keys(appData.records).sort();

        sortedDates.forEach(date => {
            if(date.startsWith(prefix)) {
                appData.records[date].forEach(rec => {
                    if(summary[rec.jobId]) {
                        let hours = calcHours(rec.start, rec.end) - summary[rec.jobId].mealDeduct;
                        if(hours < 0) hours = 0;
                        
                        let dailySalary = (hours * summary[rec.jobId].rate) + rec.allowance;
                        
                        summary[rec.jobId].totalHours += hours;
                        summary[rec.jobId].totalAllowance += rec.allowance;
                        summary[rec.jobId].salary += dailySalary;
                        
                        summary[rec.jobId].details.push({
                            date: date.substring(5), // 隱藏年份省空間
                            start: rec.start,
                            end: rec.end,
                            hours: hours,
                            allowance: rec.allowance,
                            dailySalary: dailySalary
                        });
                    }
                });
            }
        });

        const tbody = document.getElementById('summary-tbody');
        tbody.innerHTML = '';
        let grandTotal = 0;

        for(let id in summary) {
            const s = summary[id];
            if(s.totalHours > 0 || s.totalAllowance > 0) {
                grandTotal += s.salary;
                
                const detailsHTML = s.details.map(d => `
                    <tr>
                        <td>${d.date}</td>
                        <td>${d.start}-${d.end}</td>
                        <td>${d.hours.toFixed(1)}h</td>
                        <td>$${d.allowance}</td>
                        <td><strong>$${d.dailySalary.toFixed(1)}</strong></td>
                    </tr>
                `).join('');

                tbody.innerHTML += `
                    <tr class="clickable-row" onclick="toggleDetails('detail-${id}')">
                        <td>
                            <strong>${s.name}</strong> 
                            <span class="expand-hint">▼ 展開</span>
                        </td>
                        <td>${s.totalHours.toFixed(1)}</td>
                        <td>$${s.totalAllowance}</td>
                        <td><strong>$${s.salary.toFixed(1)}</strong></td>
                    </tr>
                    <tr id="detail-${id}" class="detail-row" style="display:none;">
                        <td colspan="4">
                            <div class="table-responsive" style="border:none;">
                                <table class="detail-table">
                                    <thead>
                                        <tr>
                                            <th>日期</th>
                                            <th>時間</th>
                                            <th>時數</th>
                                            <th>津貼</th>
                                            <th>工資</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${detailsHTML}
                                    </tbody>
                                </table>
                            </div>
                        </td>
                    </tr>
                `;
            }
        }
        document.getElementById('total-salary').innerText = grandTotal.toFixed(1);
    }

    function toggleDetails(rowId) {
        const row = document.getElementById(rowId);
        row.style.display = (row.style.display === 'none') ? 'table-row' : 'none';
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData));
        const dlAnchorElem = document.createElement('a');
        dlAnchorElem.setAttribute("href", dataStr);
        dlAnchorElem.setAttribute("download", `兼職紀錄_${new Date().getTime()}.json`);
        dlAnchorElem.click();
    }

    function uploadData(event) {
        const file = event.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                appData = JSON.parse(e.target.result);
                saveToLocal();
                enterApp();
            } catch(err) {
                alert("檔案格式錯誤！請確保是有效的 JSON 檔。");
            }
        };
        reader.readAsText(file);
    }
</script>
